<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE BEYOND SHOW - Community Hub & Wheel</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --gold: #d4af37;
            --gold-light: #ffa300;
            --amethyst: #a855f7;
            --steel: #60a5fa;
            --burgundy: #722f37;
            --kick: #53fc18;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        header {
            margin-bottom: 30px;
            border-bottom: 2px solid var(--burgundy);
            padding-bottom: 15px;
        }

        h1 {
            color: var(--gold-light);
            text-shadow: 0 0 15px rgba(255, 163, 0, 0.4);
            margin: 10px 0;
        }

        .auth-box, .profile-card {
            background-color: var(--card-bg);
            border: 1px solid var(--gold);
            border-radius: 12px;
            padding: 20px;
            max-width: 450px;
            margin: 20px auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .btn-kick {
            background-color: var(--kick);
            color: #000;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(83,252,24,0.3);
        }

        .btn-kick:hover {
            transform: scale(1.05);
            background-color: #46db13;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid #64748b;
            color: #94a3b8;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 12px;
        }

        .btn-logout:hover {
            color: #fff;
            border-color: #fff;
        }

        /* Style de l'avatar Kick */
        .avatar-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            object-fit: cover;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 20px auto;
        }

        canvas {
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
            background: var(--card-bg);
        }

        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 30px solid var(--gold-light);
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .btn-spin {
            background: linear-gradient(135deg, var(--gold), #b8860b);
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(212,175,55,0.3);
            margin-top: 15px;
        }

        .btn-spin:hover { transform: scale(1.05); }
        .btn-spin:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }

        #result {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
            color: var(--steel);
            min-height: 30px;
        }

        .coin-badge {
            background: rgba(212, 175, 55, 0.2);
            border: 1px solid var(--gold);
            padding: 6px 18px;
            border-radius: 20px;
            font-weight: bold;
            color: var(--gold-light);
            display: inline-block;
            margin-top: 10px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ THE BEYOND SHOW ⚡</h1>
        <p style="color: var(--steel);">Official Community Hub</p>
    </header>

    <!-- Zone d'authentification Kick -->
    <div id="auth-container" class="auth-box">
        <p>Log in with your Kick account to participate and save your TB-Coins!</p>
        <button class="btn-kick" onclick="loginWithKick()">Sign in with Kick</button>
    </div>

    <!-- Profil utilisateur avec Avatar Kick (Caché par défaut) -->
    <div id="user-profile" class="profile-card" style="display:none;">
        <div class="avatar-container">
            <img id="user-avatar-img" src="" alt="Kick Avatar" class="user-avatar" style="display:none;">
            <div style="text-align: left;">
                <h3 style="color: var(--gold-light); margin:0;">Welcome, <span id="username"></span>!</h3>
                <p style="margin: 5px 0 0 0; font-size: 13px; color: var(--kick);">Connected via Kick</p>
            </div>
        </div>
        <div class="coin-badge">⚡ <span id="user-coins">500</span> TB-Coins</div>
        <br>
        <button class="btn-logout" onclick="logout()">Sign out</button>
    </div>

    <!-- Roue du TB Show -->
    <div class="auth-box">
        <h3 style="color: var(--gold);">The Beyond Wheel</h3>
        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="canvas" width="320" height="320"></canvas>
        </div>
        <button id="spinBtn" class="btn-spin" onclick="spinWheel()">SPIN THE WHEEL (100 Coins)</button>
        <div id="result"></div>
    </div>

    <!-- Script Principal (Firebase v10 & Kick OAuth Logic) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // === 1. CONFIGURATION FIREBASE ===
        const firebaseConfig = {
            apiKey: "AIzaSyDkRuOlqwTcKo_KdcB-1XeJ9QBS9sEvlDY",
            authDomain: "tb-show-web.firebaseapp.com",
            databaseURL: "https://tb-show-web-default-rtdb.firebaseio.com",
            projectId: "tb-show-web",
            storageBucket: "tb-show-web.firebasestorage.app",
            messagingSenderId: "586923715595",
            appId: "1:586923715595:web:242e432436cbe522922b0e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // === 2. CONFIGURATION KICK & CLOUDFLARE ===
        const CLIENT_ID = "01M775NPQP93VF5PGP6DJR4BQF";
        const REDIRECT_URI = window.location.origin + window.location.pathname;
        const WORKER_URL = "https://nameless-base-1ca1.teebeeshow.workers.dev";

        // --- PKCE & KICK LOGIN MANAGEMENT ---
        function generateCodeVerifier() {
            const array = new Uint8Array(32);
            window.crypto.getRandomValues(array);
            return btoa(String.fromCharCode.apply(null, array))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        async function generateCodeChallenge(verifier) {
            const encoder = new TextEncoder();
            const data = encoder.encode(verifier);
            const digest = await window.crypto.subtle.digest('SHA-256', data);
            return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        window.loginWithKick = async function() {
            const codeVerifier = generateCodeVerifier();
            localStorage.setItem('kick_code_verifier', codeVerifier);
            const codeChallenge = await generateCodeChallenge(codeVerifier);

            const authUrl = new URL("https://id.kick.com/oauth/authorize");
            authUrl.searchParams.append("client_id", CLIENT_ID);
            authUrl.searchParams.append("redirect_uri", REDIRECT_URI);
            authUrl.searchParams.append("response_type", "code");
            authUrl.searchParams.append("scope", "user:read channel:read chat:write");
            authUrl.searchParams.append("code_challenge", codeChallenge);
            authUrl.searchParams.append("code_challenge_method", "S256");

            window.location.href = authUrl.toString();
        }

        window.logout = function() {
            localStorage.removeItem('tb_current_user');
            localStorage.removeItem('kick_code_verifier');
            window.location.reload();
        }

        // Fonction pour afficher le profil utilisateur dans le DOM
        function renderUserProfile(userData) {
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('user-profile').style.display = 'block';
            document.getElementById('username').innerText = userData.username;
            document.getElementById('user-coins').innerText = userData.coins;

            if (userData.profile_pic) {
                const avatarImg = document.getElementById('user-avatar-img');
                avatarImg.src = userData.profile_pic;
                avatarImg.style.display = 'block';
            }
        }

        // Check on load / Kick redirect return
        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const authCode = urlParams.get('code');
            const codeVerifier = localStorage.getItem('kick_code_verifier');

            if (authCode && codeVerifier) {
                document.getElementById('auth-container').innerHTML = "<p style='color:var(--gold-light);'>Connecting to The Beyond Show...</p>";
                window.history.replaceState({}, document.title, REDIRECT_URI);

                try {
                    const response = await fetch(WORKER_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code: authCode, code_verifier: codeVerifier, redirect_uri: REDIRECT_URI })
                    });
                    const rawData = await response.json();

                    if (rawData && rawData.username) {
                        const userId = rawData.id;
                        const username = rawData.username;
                        const profilePic = rawData.profile_pic || "";

                        // Sauvegarde / Chargement depuis Firebase
                        const userRef = ref(db, 'tbshow/users/' + userId);
                        const snapshot = await get(userRef);
                        
                        let currentCoins = 500;
                        if (!snapshot.exists()) {
                            await set(userRef, { username, profile_pic: profilePic, coins: 500, last_seen: Date.now() });
                        } else {
                            currentCoins = snapshot.val().coins ?? 500;
                            await update(userRef, { username, profile_pic: profilePic, last_seen: Date.now() });
                        }

                        const userObj = { id: userId, username: username, profile_pic: profilePic, coins: currentCoins };
                        localStorage.setItem('tb_current_user', JSON.stringify(userObj));
                        renderUserProfile(userObj);
                    } else {
                        throw new Error("Empty user data");
                    }
                } catch (err) {
                    console.error("Authentication error:", err);
                    document.getElementById('auth-container').innerHTML = "<p style='color: #ef4444;'>Kick connection error. Check Redirect URI.</p><button class='btn-kick' onclick='loginWithKick()'>Try again</button>";
                }
            } else {
                const savedUser = localStorage.getItem('tb_current_user');
                if (savedUser) {
                    const u = JSON.parse(savedUser);
                    
                    // Synchronisation du solde en direct depuis Firebase
                    const userRef = ref(db, 'tbshow/users/' + u.id);
                    const snapshot = await get(userRef);
                    if (snapshot.exists()) {
                        u.coins = snapshot.val().coins ?? u.coins;
                        u.profile_pic = snapshot.val().profile_pic ?? u.profile_pic;
                        localStorage.setItem('tb_current_user', JSON.stringify(u));
                    }
                    renderUserProfile(u);
                }
            }
        });

        // === 3. WHEEL LOGIC & FIREBASE POINTS ===
        const sectors = [
            { color: "#722f37", label: "500 Coins", rewardCoins: 500 },
            { color: "#d4af37", label: "Free Sub", rewardCoins: 0 },
            { color: "#1e293b", label: "Lost :-(", rewardCoins: 0 },
            { color: "#60a5fa", label: "1000 Coins", rewardCoins: 1000 },
            { color: "#a855f7", label: "VIP 24h", rewardCoins: 0 },
            { color: "#1e293b", label: "Reroll", rewardCoins: 100 }
        ];

        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const arc = Math.PI / (sectors.length / 2);
        let isSpinning = false;

        function drawSector(sector, i) {
            const ang = arc * i;
            ctx.save();
            ctx.beginPath();
            ctx.fillStyle = sector.color;
            ctx.moveTo(160, 160);
            ctx.arc(160, 160, 150, ang, ang + arc, false);
            ctx.lineTo(160, 160);
            ctx.fill();
            ctx.strokeStyle = "#d4af37";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();

            ctx.save();
            ctx.translate(160, 160);
            ctx.rotate(ang + arc / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 13px sans-serif";
            ctx.fillText(sector.label, 135, 6);
            ctx.restore();
        }

        function drawWheel() {
            ctx.clearRect(0, 0, 320, 320);
            sectors.forEach((sec, i) => drawSector(sec, i));
        }
        drawWheel();

        window.spinWheel = async function() {
            if (isSpinning) return;

            const savedUserStr = localStorage.getItem('tb_current_user');
            if (!savedUserStr) {
                alert("Please log in with your Kick account first to play!");
                return;
            }

            let user = JSON.parse(savedUserStr);
            if (user.coins < 100) {
                document.getElementById("result").innerText = "Not enough TB-Coins (100 required)!";
                return;
            }

            // Deduct 100 coins stake
            user.coins -= 100;
            document.getElementById('user-coins').innerText = user.coins;
            localStorage.setItem('tb_current_user', JSON.stringify(user));
            await update(ref(db, 'tbshow/users/' + user.id), { coins: user.coins });

            isSpinning = true;
            document.getElementById("spinBtn").disabled = true;
            document.getElementById("result").innerText = "Wheel is spinning...";

            const randomIndex = Math.floor(Math.random() * sectors.length);
            const arcSize = 360 / sectors.length;
            const targetAngle = 360 * 5 + (sectors.length - randomIndex) * arcSize - arcSize / 2;

            let currentRotation = 0;
            const duration = 3500;
            const start = performance.now();

            function animate(time) {
                const elapsed = time - start;
                const progress = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 3);
                currentRotation = ease * targetAngle;
                canvas.style.transform = `rotate(${currentRotation}deg)`;

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    document.getElementById("spinBtn").disabled = false;
                    const winning = sectors[randomIndex];
                    document.getElementById("result").innerText = `Result: ${winning.label}! 🎉`;

                    // Credit potential winnings
                    if (winning.rewardCoins > 0) {
                        user.coins += winning.rewardCoins;
                        document.getElementById('user-coins').innerText = user.coins;
                        localStorage.setItem('tb_current_user', JSON.stringify(user));
                        update(ref(db, 'tbshow/users/' + user.id), { coins: user.coins });
                    }

                    // Save latest spin to Firebase (for OBS alerts)
                    set(ref(db, 'tbshow/latest_spin'), {
                        username: user.username,
                        reward: winning.label,
                        timestamp: Date.now()
                    });
                }
            }
            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
