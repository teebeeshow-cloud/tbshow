<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE BEYOND SHOW — Community Hub & Wheel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090b10;
            --card-bg: #121622;
            --gold: #d4af37;
            --gold-bright: #ffae00;
            --burgundy: #722f37;
            --burgundy-dark: #4a1c22;
            --burgundy-light: #963d48;
            --steel: #60a5fa;
            --neon-pink: #e0828a;
            --kick-green: #53fc18;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at top, #181c2e 0%, var(--bg-dark) 75%);
            color: #f8fafc;
            font-family: 'Montserrat', sans-serif;
            text-align: center;
            margin: 0;
            padding: 25px 15px;
            min-height: 100vh;
        }

        header {
            max-width: 600px;
            margin: 0 auto 30px auto;
            padding-bottom: 18px;
            border-bottom: 2px solid var(--burgundy);
            box-shadow: 0 4px 20px -10px var(--neon-pink);
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: 2.1rem;
            letter-spacing: 3px;
            color: var(--gold-bright);
            text-shadow: 0 0 18px rgba(255, 174, 0, 0.5), 0 2px 4px #000;
            margin: 0 0 6px 0;
        }

        .subtitle {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--neon-pink);
            margin: 0;
        }

        .panel-card {
            background: linear-gradient(145deg, #161b29, var(--card-bg));
            border: 1px solid var(--gold);
            border-top: 3px solid var(--gold-bright);
            border-radius: 14px;
            padding: 24px;
            max-width: 460px;
            margin: 22px auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75), inset 0 0 15px rgba(212, 175, 55, 0.08);
        }

        .panel-title {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: 1.5px;
            color: var(--gold-bright);
            text-transform: uppercase;
            margin: 0 0 16px 0;
        }

        .btn-kick {
            background: linear-gradient(135deg, var(--kick-green), #38c90a);
            color: #05070a;
            border: none;
            padding: 14px 28px;
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 18px rgba(83, 252, 24, 0.35);
            width: 100%;
        }

        .btn-kick:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(83, 252, 24, 0.55);
        }

        .btn-logout {
            background: rgba(114, 47, 55, 0.3);
            border: 1px solid var(--burgundy);
            color: var(--neon-pink);
            padding: 6px 16px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            border-radius: 6px;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 16px;
            transition: 0.2s;
        }

        .btn-logout:hover {
            background: var(--burgundy);
            color: #fff;
        }

        .avatar-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .user-avatar {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            border: 2px solid var(--gold-bright);
            object-fit: cover;
            box-shadow: 0 0 16px rgba(255, 174, 0, 0.45);
        }

        .coin-badge {
            background: linear-gradient(90deg, rgba(114, 47, 55, 0.6), rgba(212, 175, 55, 0.2));
            border: 1px solid var(--gold-bright);
            padding: 8px 22px;
            border-radius: 30px;
            font-family: 'Big Shoulders Display', sans-serif;
            font-weight: 900;
            color: var(--gold-bright);
            display: inline-block;
            font-size: 22px;
            letter-spacing: 1px;
            box-shadow: 0 0 12px rgba(255, 174, 0, 0.2);
        }

        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 20px auto;
        }

        canvas {
            border-radius: 50%;
            border: 3px solid var(--gold);
            box-shadow: 0 0 30px rgba(114, 47, 55, 0.4), 0 0 15px rgba(212, 175, 55, 0.3);
            background: var(--bg-dark);
        }

        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-bottom: 32px solid var(--gold-bright);
            z-index: 10;
            filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.8));
        }

        .btn-spin {
            background: linear-gradient(135deg, var(--gold-bright), var(--gold));
            color: #090b10;
            border: none;
            padding: 14px 32px;
            font-family: 'Big Shoulders Display', sans-serif;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 18px rgba(255, 174, 0, 0.35);
            margin-top: 15px;
            width: 100%;
        }

        .btn-spin:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(255, 174, 0, 0.55);
        }

        .btn-spin:disabled {
            background: #283044;
            color: #64748b;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #result {
            margin-top: 16px;
            font-family: 'Big Shoulders Display', sans-serif;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
            color: var(--gold-bright);
            min-height: 28px;
            text-shadow: 0 0 12px rgba(255, 174, 0, 0.4);
        }
    </style>
</head>
<body>

    <header>
        <h1>THE BEYOND SHOW</h1>
        <p class="subtitle">Official Community Hub</p>
    </header>

    <!-- Kick OAuth Authentication -->
    <div id="auth-container" class="panel-card">
        <p style="color: #cbd5e1; font-size: 14px; line-height: 1.5; margin-top: 0; margin-bottom: 20px;">
            Connect your official Kick account to earn TB-Coins, spin the wheel live, and claim exclusive stream rewards.
        </p>
        <button class="btn-kick" onclick="loginWithKick()">Sign in with Kick</button>
    </div>

    <!-- Authenticated User Profile -->
    <div id="user-profile" class="panel-card" style="display:none;">
        <div class="avatar-container">
            <img id="user-avatar-img" src="" alt="Kick Avatar" class="user-avatar" style="display:none;">
            <div style="text-align: left;">
                <h3 style="font-family: 'Cinzel', serif; color: var(--gold-bright); margin: 0; font-size: 1.25rem;">
                    Welcome, <span id="username"></span>
                </h3>
                <p style="margin: 5px 0 0 0; font-size: 12px; font-weight: 600; color: var(--kick-green); letter-spacing: 0.5px;">
                    ● CONNECTED VIA KICK
                </p>
            </div>
        </div>
        <div class="coin-badge">⚡ <span id="user-coins">500</span> TB-COINS</div>
        <br>
        <button class="btn-logout" onclick="logout()">Sign Out</button>
    </div>

    <!-- The Beyond Wheel -->
    <div class="panel-card">
        <h3 class="panel-title">The Beyond Wheel</h3>
        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="canvas" width="320" height="320"></canvas>
        </div>
        <button id="spinBtn" class="btn-spin" onclick="spinWheel()">Spin the Wheel (100 Coins)</button>
        <div id="result"></div>
    </div>

    <!-- Main Script (Firebase v10 & Kick OAuth 2.1 PKCE) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // === 1. FIREBASE CONFIGURATION (European Region) ===
        const firebaseConfig = {
            apiKey: "AIzaSyDkRuOlqwTcKo_KdcB-1XeJ9QBS9sEvlDY",
            authDomain: "tb-show-web.firebaseapp.com",
            databaseURL: "https://tb-show-web-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "tb-show-web",
            storageBucket: "tb-show-web.firebasestorage.app",
            messagingSenderId: "586923715595",
            appId: "1:586923715595:web:242e432436cbe522922b0e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // === 2. KICK & CLOUDFLARE WORKER CONFIGURATION ===
        const CLIENT_ID = "01M775NPQP93VF5PGP6DJR4BQF";
        const REDIRECT_URI = "https://teebeeshow-cloud.github.io/tbshow/";
        const WORKER_URL = "https://nameless-base-1ca1.teebeeshow.workers.dev";

        function generateRandomString(length = 32) {
            const array = new Uint8Array(length);
            window.crypto.getRandomValues(array);
            return btoa(String.fromCharCode.apply(null, array))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        async function generateCodeChallenge(verifier) {
            const encoder = new TextEncoder();
            const data = encoder.encode(verifier);
            const digest = await window.crypto.subtle.digest('SHA-256', data);
            return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        window.loginWithKick = async function() {
            const codeVerifier = generateRandomString(32);
            const oauthState = generateRandomString(16);

            localStorage.setItem('kick_code_verifier', codeVerifier);
            localStorage.setItem('kick_oauth_state', oauthState);

            const codeChallenge = await generateCodeChallenge(codeVerifier);

            const authUrl = new URL("https://id.kick.com/oauth/authorize");
            authUrl.searchParams.append("response_type", "code");
            authUrl.searchParams.append("client_id", CLIENT_ID);
            authUrl.searchParams.append("redirect_uri", REDIRECT_URI);
            authUrl.searchParams.append("scope", "user:read channel:read chat:write events:subscribe");
            authUrl.searchParams.append("code_challenge", codeChallenge);
            authUrl.searchParams.append("code_challenge_method", "S256");
            authUrl.searchParams.append("state", oauthState);

            console.log("Redirecting to Kick OAuth:", authUrl.toString());
            window.location.href = authUrl.toString();
        }

        window.logout = function() {
            localStorage.removeItem('tb_current_user');
            localStorage.removeItem('kick_code_verifier');
            localStorage.removeItem('kick_oauth_state');
            window.location.reload();
        }

        function renderUserProfile(userData) {
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('user-profile').style.display = 'block';
            document.getElementById('username').innerText = userData.username;
            document.getElementById('user-coins').innerText = userData.coins;

            if (userData.profile_pic) {
                const avatarImg = document.getElementById('user-avatar-img');
                avatarImg.src = userData.profile_pic;
                avatarImg.style.display = 'block';
            }
        }

        // OAuth Callback Handling
        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const authCode = urlParams.get('code');
            const returnedState = urlParams.get('state');
            const savedState = localStorage.getItem('kick_oauth_state');
            const codeVerifier = localStorage.getItem('kick_code_verifier');

            if (authCode && codeVerifier) {
                if (returnedState && savedState && returnedState !== savedState) {
                    console.error("OAuth security error: state mismatch.");
                    document.getElementById('auth-container').innerHTML = "<p style='color: #e0828a; font-weight: 600;'>Security verification failed. Please try again.</p><button class='btn-kick' onclick='loginWithKick()'>Retry Sign In</button>";
                    return;
                }

                document.getElementById('auth-container').innerHTML = "<p style='color: var(--gold-bright); font-weight: 600;'>Authenticating with Kick...</p>";
                window.history.replaceState({}, document.title, REDIRECT_URI);

                try {
                    const response = await fetch(WORKER_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            code: authCode,
                            code_verifier: codeVerifier,
                            redirect_uri: REDIRECT_URI
                        })
                    });
                    const rawData = await response.json();

                    if (rawData && rawData.username) {
                        const userId = rawData.id;
                        const username = rawData.username;
                        const profilePic = rawData.profile_pic || "";

                        const userRef = ref(db, 'tbshow/users/' + userId);
                        const snapshot = await get(userRef);

                        let currentCoins = 500;
                        if (!snapshot.exists()) {
                            await set(userRef, {
                                username: username,
                                profile_pic: profilePic,
                                coins: 500,
                                last_seen: Date.now()
                            });
                        } else {
                            currentCoins = snapshot.val().coins ?? 500;
                            await update(userRef, {
                                username: username,
                                profile_pic: profilePic,
                                last_seen: Date.now()
                            });
                        }

                        const userObj = { id: userId, username: username, profile_pic: profilePic, coins: currentCoins };
                        localStorage.setItem('tb_current_user', JSON.stringify(userObj));
                        localStorage.removeItem('kick_code_verifier');
                        localStorage.removeItem('kick_oauth_state');
                        renderUserProfile(userObj);
                    } else {
                        throw new Error("Invalid user payload from Kick");
                    }
                } catch (err) {
                    console.error("Authentication error:", err);
                    document.getElementById('auth-container').innerHTML = "<p style='color: #e0828a; font-weight: 600;'>Kick token exchange failed.</p><button class='btn-kick' onclick='loginWithKick()'>Try Again</button>";
                }
            } else {
                const savedUser = localStorage.getItem('tb_current_user');
                if (savedUser) {
                    const u = JSON.parse(savedUser);
                    const userRef = ref(db, 'tbshow/users/' + u.id);
                    const snapshot = await get(userRef);
                    if (snapshot.exists()) {
                        u.coins = snapshot.val().coins ?? u.coins;
                        u.profile_pic = snapshot.val().profile_pic ?? u.profile_pic;
                        localStorage.setItem('tb_current_user', JSON.stringify(u));
                    }
                    renderUserProfile(u);
                }
            }
        });

        // === 3. WHEEL LOGIC (Gold & Burgundy Palette + Big Shoulders Font) ===
        const sectors = [
            { color: "#722f37", label: "500 COINS", rewardCoins: 500 },
            { color: "#d4af37", label: "FREE SUB", rewardCoins: 0 },
            { color: "#4a1c22", label: "NO LUCK", rewardCoins: 0 },
            { color: "#ffae00", label: "1000 COINS", rewardCoins: 1000 },
            { color: "#963d48", label: "VIP 24H", rewardCoins: 0 },
            { color: "#b8860b", label: "FREE SPIN", rewardCoins: 100 }
        ];

        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const arc = Math.PI / (sectors.length / 2);
        let isSpinning = false;

        function drawSector(sector, i) {
            const ang = arc * i;
            ctx.save();
            ctx.beginPath();
            ctx.fillStyle = sector.color;
            ctx.moveTo(160, 160);
            ctx.arc(160, 160, 152, ang, ang + arc, false);
            ctx.lineTo(160, 160);
            ctx.fill();
            ctx.strokeStyle = "#ffae00";
            ctx.lineWidth = 2.5;
            ctx.stroke();
            ctx.restore();

            ctx.save();
            ctx.translate(160, 160);
            ctx.rotate(ang + arc / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#ffffff";
            ctx.font = "900 17px 'Big Shoulders Display', sans-serif";
            ctx.shadowColor = "rgba(0, 0, 0, 0.9)";
            ctx.shadowBlur = 5;
            ctx.fillText(sector.label, 138, 6);
            ctx.restore();
        }

        function drawWheel() {
            ctx.clearRect(0, 0, 320, 320);
            sectors.forEach((sec, i) => drawSector(sec, i));
        }
        drawWheel();

        window.spinWheel = async function() {
            if (isSpinning) return;

            const savedUserStr = localStorage.getItem('tb_current_user');
            if (!savedUserStr) {
                document.getElementById("result").innerText = "Please sign in with Kick first!";
                return;
            }

            let user = JSON.parse(savedUserStr);
            if (user.coins < 100) {
                document.getElementById("result").innerText = "Insufficient TB-Coins (100 required)!";
                return;
            }

            user.coins -= 100;
            document.getElementById('user-coins').innerText = user.coins;
            localStorage.setItem('tb_current_user', JSON.stringify(user));
            await update(ref(db, 'tbshow/users/' + user.id), { coins: user.coins });

            isSpinning = true;
            document.getElementById("spinBtn").disabled = true;
            document.getElementById("result").innerText = "Spinning...";

            const randomIndex = Math.floor(Math.random() * sectors.length);
            const arcSize = 360 / sectors.length;
            const targetAngle = 360 * 5 + (sectors.length - randomIndex) * arcSize - arcSize / 2;

            let currentRotation = 0;
            const duration = 3500;
            const start = performance.now();

            function animate(time) {
                const elapsed = time - start;
                const progress = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 3);
                currentRotation = ease * targetAngle;
                canvas.style.transform = `rotate(${currentRotation}deg)`;

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    document.getElementById("spinBtn").disabled = false;
                    const winning = sectors[randomIndex];
                    document.getElementById("result").innerText = `Result: ${winning.label}!`;

                    if (winning.rewardCoins > 0) {
                        user.coins += winning.rewardCoins;
                        document.getElementById('user-coins').innerText = user.coins;
                        localStorage.setItem('tb_current_user', JSON.stringify(user));
                        update(ref(db, 'tbshow/users/' + user.id), { coins: user.coins });
                    }

                    set(ref(db, 'tbshow/latest_spin'), {
                        user_id: user.id,
                        username: user.username,
                        reward: winning.label,
                        timestamp: Date.now()
                    });
                }
            }
            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
